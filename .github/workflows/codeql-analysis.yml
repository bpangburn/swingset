name: CodeQL

on:
  push:
    branches:
      - master
      - "4.0.*-SNAPSHOT"
  pull_request:
    branches:
      - master
      - "4.0.*-SNAPSHOT"
  schedule:
    - cron: "33 7 * * 1"

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Full reactor includes H2 2.x, which requires Java 11 or newer.
          # Java 8 compatibility of swingset core is tested separately in Maven Build.
          java-version: '11'
          cache: maven

      - name: Install Maven 3.9.16
        shell: bash
        run: |
          set -euo pipefail
          version=3.9.16
          base="https://downloads.apache.org/maven/maven-3/${version}/binaries"
          archive="$RUNNER_TEMP/apache-maven-${version}-bin.tar.gz"
          curl --fail --silent --show-error --location "${base}/apache-maven-${version}-bin.tar.gz" -o "$archive"
          curl --fail --silent --show-error --location "${base}/apache-maven-${version}-bin.tar.gz.sha512" -o "$archive.sha512"
          expected="$(tr -d '[:space:]' < "$archive.sha512")"
          echo "$expected  $archive" | sha512sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${version}/bin" >> "$GITHUB_PATH"

      - name: Verify Maven version
        run: mvn --version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          queries: security-extended,security-and-quality

      - name: Build project
        run: mvn clean compile

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
