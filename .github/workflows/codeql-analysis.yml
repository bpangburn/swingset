name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [ "master", "4.0.*-SNAPSHOT" ]
  pull_request:
    branches: [ "master", "4.0.*-SNAPSHOT" ]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Install Maven 3.9.16
        shell: bash
        run: |
          set -euo pipefail
          version=3.9.16
          base="https://downloads.apache.org/maven/maven-3/${version}/binaries"
          archive="$RUNNER_TEMP/apache-maven-${version}-bin.tar.gz"
          curl --fail --silent --show-error --location "${base}/apache-maven-${version}-bin.tar.gz" -o "$archive"
          curl --fail --silent --show-error --location "${base}/apache-maven-${version}-bin.tar.gz.sha512" -o "$archive.sha512"
          expected="$(tr -d '[:space:]' < "$archive.sha512")"
          echo "$expected  $archive" | sha512sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${version}/bin" >> "$GITHUB_PATH"

      - name: Verify Maven version
        run: mvn --version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          build-mode: manual

      - name: Build Project
        run: mvn -B -ntp clean compile

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
