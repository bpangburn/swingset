name: Maven Build (SS-5-WRAPPER)

# Temporary manual-only workflow while dev.visdb.seesaw:seesaw:0.5.2
# is not published to Maven Central. Restore push/PR triggers after release.
# Manual runs currently fail at dependency resolution; this is expected.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-wrapper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test with JDK 25
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify toolchain
        run: |
          java -version
          mvn -version

      # frgaal compiles Java 25 source to the configured Java 17 target.
      # Running this build on JDK 17 would not exercise the intended compiler.
      - name: Build and test full reactor
        run: mvn -B -ntp clean verify
