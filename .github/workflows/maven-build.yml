name: Maven Build

on:
  workflow_dispatch:
  push:
    branches: [master, '4.0.*-SNAPSHOT']
  pull_request:
    branches: [master, '4.0.*-SNAPSHOT']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java-version: [8, 11, 17, 21, 25]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      # 4.x core must remain compatible with Java 8. The demo may require
      # a later JDK, so it is excluded from this compatibility job.
      - name: Install Maven 3.9.16
        shell: bash
        run: |
          set -euo pipefail
          version=3.9.16
          base="https://downloads.apache.org/maven/maven-3/${version}/binaries"
          archive="$RUNNER_TEMP/apache-maven-${version}-bin.tar.gz"
          curl --fail --silent --show-error --location "${base}/apache-maven-${version}-bin.tar.gz" -o "$archive"
          curl --fail --silent --show-error --location "${base}/apache-maven-${version}-bin.tar.gz.sha512" -o "$archive.sha512"
          expected="$(tr -d '[:space:]' < "$archive.sha512")"
          echo "$expected  $archive" | sha512sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${version}/bin" >> "$GITHUB_PATH"

      - name: Verify Maven version
        run: mvn --version

      - name: Verify SwingSet core on Java 8
        if: matrix.java-version == 8
        run: mvn -B -ntp clean verify -pl swingset -am

      - name: Verify full reactor on newer Java
        if: matrix.java-version != 8
        run: mvn -B -ntp clean verify
