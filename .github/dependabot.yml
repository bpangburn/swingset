version: 2

# Keep the default branch and maintained release/development lines
# independent; updates still require compatibility checks before merging.
updates:
  # Group routine minor/patch updates; security, application and major
  # version updates remain independently reviewable.
  - package-ecosystem: maven
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # JUnit 5 remains the test framework while Java 8 is supported.
    ignore:
      - dependency-name: "org.junit.jupiter:junit-jupiter"
        update-types:
          - "version-update:semver-major"
    groups:
      maven-build-tools:
        applies-to: version-updates
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.codehaus.mojo:versions-maven-plugin"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-actions:
        applies-to: version-updates
        patterns:
          - "actions/*"
        update-types:
          - minor
          - patch

  # Java 8 core compatibility branch. Review all proposed upgrades for
  # Java 8 bytecode/runtime requirements and verify the core CI matrix.
  - package-ecosystem: maven
    directory: /
    target-branch: 4.0.14-SNAPSHOT
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # JUnit 5 remains the test framework while Java 8 is supported.
    ignore:
      - dependency-name: "org.junit.jupiter:junit-jupiter"
        update-types:
          - "version-update:semver-major"
    groups:
      maven-build-tools:
        applies-to: version-updates
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.codehaus.mojo:versions-maven-plugin"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: 4.0.14-SNAPSHOT
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-actions:
        applies-to: version-updates
        patterns:
          - "actions/*"
        update-types:
          - minor
          - patch

  # SeeSaw wrapper: frgaal compiles Java 25 sources to Java 17 target.
  - package-ecosystem: maven
    directory: /
    target-branch: SS-5-WRAPPER
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Temporary: reconsider JUnit 6 after SeeSaw 0.5.2 is published
    # and JDK 25 / Java 17-targeted test execution is verified.
    ignore:
      - dependency-name: "org.junit.jupiter:junit-jupiter"
        update-types:
          - "version-update:semver-major"
    groups:
      maven-build-tools:
        applies-to: version-updates
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.codehaus.mojo:versions-maven-plugin"
        # Review compiler/frgaal compatibility separately.
        exclude-patterns:
          - "org.apache.maven.plugins:maven-compiler-plugin"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: SS-5-WRAPPER
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-actions:
        applies-to: version-updates
        patterns:
          - "actions/*"
        update-types:
          - minor
          - patch
